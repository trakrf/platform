name: Sync Preview Branch

on:
  pull_request:
    # ready_for_review and converted_to_draft change whether a PR is a
    # candidate, so they recompose preview like any other change to the set.
    types: [opened, synchronize, reopened, closed, ready_for_review, converted_to_draft]
  push:
    branches: [main]

concurrency:
  group: preview-sync
  cancel-in-progress: false

jobs:
  sync-preview:
    runs-on: ubuntu-latest
    # Explicit bash is `bash -eo pipefail`; the default omits pipefail, which let
    # a failing `script | tee` pass as an empty plan.
    defaults:
      run:
        shell: bash
    permissions:
      contents: write
      pull-requests: write

    steps:
      # Mint an installation token from the trakrf-preview-sync GitHub App so
      # the push to `preview` is attributed to the App, not `github-actions[bot]`.
      # Pushes authenticated with the default GITHUB_TOKEN do not trigger
      # downstream workflows (GitHub's anti-recursion safeguard), which left
      # docker-build.yml's `push: branches: [preview]` trigger permanently
      # inert. App-minted tokens are not subject to that gate, so the chain
      # sync-preview → docker-build → :preview tag now fires end-to-end.
      - name: Generate App token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.PREVIEW_SYNC_APP_ID }}
          private-key: ${{ secrets.PREVIEW_SYNC_APP_PRIVATE_KEY }}

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # Resetting to main swaps the working tree, so the composition script is
      # copied out first: it must come from the commit this run was triggered
      # for, not from whatever main or the composed preview happens to carry.
      - name: Keep the composition script
        run: cp scripts/preview-composition.sh "$RUNNER_TEMP/preview-composition.sh"

      - name: Reset preview to main
        run: |
          git checkout -B preview origin/main

      - name: Get all open PRs
        id: get-prs
        uses: actions/github-script@v7
        with:
          script: |
            const { data: prs } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              sort: 'created',
              direction: 'asc'
            });

            // Drafts are excluded, and so is anything not based on main:
            // preview is a composition OF MAIN, so a PR based elsewhere is not
            // a candidate for it. Hotfix PRs target a `release/X.Y.x` line cut
            // from a shipped tag (TRA-1127, docs/releasing.md) — stacking one
            // here conflicts on VERSION and then tells its author to "resolve
            // conflicts with the main branch", which is exactly the wrong move
            // on a hotfix.
            const activePRs = prs.filter(pr => !pr.draft && pr.base.ref === 'main');

            // Return PR numbers and their branch names
            const prInfo = activePRs.map(pr => ({
              number: pr.number,
              branch: pr.head.ref,
              title: pr.title
            }));

            console.log(`Found ${prInfo.length} open PRs to merge`);
            return prInfo;

      # Decide which PRs' migration numbers may reach preview's shared database,
      # and merge those. The rule and the merging live in a tested script rather
      # than here, so `just test` exercises both; see the header of that script.
      # A PR that conflicts is dropped and the rest re-planned without it, so its
      # numbers never keep another PR out.
      - name: Compose preview
        id: compose
        env:
          PRS: ${{ steps.get-prs.outputs.result }}
        run: |
          candidates="$RUNNER_TEMP/candidates"
          : > "$candidates"
          unfetched=()
          while read -r number branch title; do
            [ -n "$number" ] || continue
            # A branch that cannot be fetched (a fork's) is left out and reported
            # as a conflict, as it was when the merge itself failed.
            if git fetch -q origin "refs/heads/$branch:refs/remotes/origin/$branch"; then
              echo "$number origin/$branch $title" >> "$candidates"
            else
              echo "::warning::could not fetch $branch for PR #$number"
              unfetched+=("$number")
            fi
          done < <(jq -r '.[] | "\(.number) \(.branch) \(.title)"' <<<"$PRS")

          previous=""
          if git rev-parse -q --verify origin/preview >/dev/null; then
            previous=origin/preview
          fi
          # $previous is unquoted on purpose: empty means no previous build.
          "$RUNNER_TEMP/preview-composition.sh" compose origin/main "$RUNNER_TEMP/candidates" $previous |
            tee "$RUNNER_TEMP/composition"
          for number in "${unfetched[@]}"; do echo "conflict $number"; done >> "$RUNNER_TEMP/composition"

      - name: Read the composition
        id: merge-prs
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const prs = ${{ steps.get-prs.outputs.result }};
            const byNumber = new Map(prs.map(pr => [pr.number, pr]));
            const lines = fs.readFileSync(`${process.env.RUNNER_TEMP}/composition`, 'utf8')
              .split('\n').filter(Boolean);

            const conflicts = [];
            const merged = [];
            const excluded = [];
            for (const line of lines) {
              let m;
              if ((m = /^merged (\d+) /.exec(line))) {
                merged.push(Number(m[1]));
              } else if ((m = /^conflict (\d+)$/.exec(line))) {
                conflicts.push(byNumber.get(Number(m[1])));
              } else if ((m = /^exclude (\d+) (\d+) (.*)$/.exec(line))) {
                excluded.push({ ...byNumber.get(Number(m[1])), version: Number(m[2]), reason: m[3] });
              } else {
                core.setFailed(`unreadable composition line: ${line}`);
                return;
              }
            }

            const result = { conflicts, merged, excluded };
            core.setOutput('conflicts', JSON.stringify(conflicts));
            core.setOutput('merged', JSON.stringify(merged));
            core.setOutput('result', JSON.stringify(result));
            return result;

      - name: Write preview manifest
        # When any PRs were merged, write a `.preview-manifest` file listing
        # them (one PR# per line) and commit it. docker-build.yml reads this
        # file and appends `-preview+419+420...` to the version string, so the
        # UI header on app.preview.trakrf.id shows exactly which PRs are in the
        # current preview build (TRA-851).
        if: steps.merge-prs.outputs.merged != '' && steps.merge-prs.outputs.merged != '[]'
        run: |
          echo '${{ steps.merge-prs.outputs.merged }}' | jq -r '.[]' > .preview-manifest
          # -f because .preview-manifest is gitignored to prevent developers
          # from accidentally committing it from a feature branch. CI on the
          # preview branch is the only legitimate author.
          git add -f .preview-manifest
          if ! git diff --cached --quiet; then
            git commit -m "preview: manifest of merged PRs"
          fi

      # A migration file the previous build carried and this one lacks, or
      # carries changed, means preview's ledger is now ahead of its image: the
      # PR that brought it conflicted, was excluded, closed, or rewrote it.
      # Recorded here, reported after the push and the PR comments, and then
      # the run fails. The migrate Job refuses that image before writing, so
      # the database is safe; the red run is how someone finds out.
      - name: Check for migrations dropped from the previous build
        id: dropped
        run: |
          if ! git rev-parse -q --verify origin/preview >/dev/null; then
            echo "No previous preview build to compare against"
            exit 0
          fi
          status=0
          files=$("$RUNNER_TEMP/preview-composition.sh" dropped origin/preview HEAD) || status=$?
          if [ "$status" -eq 0 ]; then
            echo "No migrations dropped"
            exit 0
          fi
          # Exit 1 with files named is a drop; anything else is the check
          # failing to run, which must not pass for either answer.
          if [ "$status" -ne 1 ] || [ -z "$files" ]; then
            echo "::error::the dropped-migrations check could not run (exit $status)"
            exit 1
          fi
          previous=$(git show origin/preview:.preview-manifest 2>/dev/null || true)
          current=$(cat .preview-manifest 2>/dev/null || true)
          left=$(comm -23 <(sort -u <<<"$previous") <(sort -u <<<"$current") | sed '/^$/d; s/^/#/' | paste -sd' ' -)
          {
            echo "found=true"
            echo "left=${left:-none}"
            echo "files<<EOF"
            echo "$files"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Push preview branch
        id: push-preview
        run: |
          # Check if remote preview branch exists
          if git ls-remote --exit-code --heads origin preview > /dev/null 2>&1; then
            # preview branch exists, check for changes
            if git diff --quiet origin/preview; then
              echo "No changes to push"
              echo "pushed=false" >> $GITHUB_OUTPUT
            else
              git push origin preview --force-with-lease
              echo "pushed=true" >> $GITHUB_OUTPUT
              echo "Preview branch updated successfully"
            fi
          else
            # preview branch does not exist, push it
            git push origin preview
            echo "pushed=true" >> $GITHUB_OUTPUT
            echo "Preview branch created and pushed"
          fi
        continue-on-error: true

      - name: Handle push failure
        if: steps.push-preview.outcome == 'failure'
        run: |
          # Force push if lease fails (someone else updated preview)
          git push origin preview --force
          echo "Preview branch force-pushed due to concurrent update"

      - name: Post deployment status comment
        if: github.event_name == 'pull_request' && steps.push-preview.outputs.pushed == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = context.payload.pull_request.number;
            const mergeResult = ${{ steps.merge-prs.outputs.result }};

            // Only the success notice belongs here. Exclusions and conflicts are
            // announced by the next step to every PR whose status changed.
            if (!mergeResult.merged.includes(prNumber)) {
              return;
            }

            let comment = '🚀 **Preview Deployment Update**\n\n';
            comment += '✅ This PR has been successfully merged into the preview branch.\n\n';
            comment += 'The preview environment will update shortly at: **https://app.preview.trakrf.id**\n\n';

            const left = [...mergeResult.conflicts, ...mergeResult.excluded];
            if (left.length > 0) {
              comment += `⚠️ Note: The following PRs were not included in preview:\n`;
              left.forEach(pr => {
                comment += `- PR #${pr.number}: ${pr.title}\n`;
              });
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              body: comment
            });

      # Every PR whose place in preview changed hears about it on this run,
      # whichever PR triggered it. The conflict notice used to go only to the
      # triggering PR, so a PR dropped by someone else's push was dropped
      # silently while its migrations stayed applied on preview.
      #
      # Each notice carries a marker, and a PR is told again only when its
      # status differs from the last marker it was sent.
      - name: Comment on PRs whose preview status changed
        if: always() && steps.merge-prs.outcome == 'success'
        uses: actions/github-script@v7
        with:
          script: |
            const mergeResult = ${{ steps.merge-prs.outputs.result }};
            const markerRe = /<!-- preview-sync-status: (.*?) -->/;

            const lastStatus = async (number) => {
              const comments = await github.paginate(github.rest.issues.listComments, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: number,
                per_page: 100
              });
              let last = null;
              for (const c of comments) {
                const m = markerRe.exec(c.body || '');
                if (m) last = m[1];
              }
              return [number, last];
            };

            // Each PR's comments are read once, all at the same time.
            const numbers = [
              ...mergeResult.excluded.map(pr => pr.number),
              ...mergeResult.conflicts.map(pr => pr.number),
              ...mergeResult.merged
            ];
            const last = new Map(await Promise.all(numbers.map(lastStatus)));

            const notify = async (number, status, body) => {
              if (last.get(number) === status) return;
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: number,
                body: `${body}\n\n<!-- preview-sync-status: ${status} -->`
              });
            };

            // The marker records the status, not the advice: "renumber above N"
            // moves as other PRs come and go, and that alone is not news.
            for (const pr of mergeResult.excluded) {
              await notify(pr.number, `excluded: migration ${pr.version}`,
                `⛔ **Left out of preview: migration number**\n\n` +
                `This PR was not composed into preview because ${pr.reason}.\n\n` +
                `Preview applies every open PR's migrations to one shared database, and golang-migrate ` +
                `remembers only the number, so a number that changes after it has been applied there leaves ` +
                `preview's database describing a file that no longer exists. See ` +
                `\`backend/migrations/CONVENTIONS.md\`.`);
            }
            for (const pr of mergeResult.conflicts) {
              await notify(pr.number, 'conflict',
                `⚠️ **Merge Conflict Detected**\n\n` +
                `This PR has conflicts with the current preview branch (main + other open PRs) and is not in preview.\n\n` +
                `Please resolve conflicts with the main branch or wait for conflicting PRs to be merged first.\n\n` +
                `PRs in preview: ${mergeResult.merged.join(', ') || 'none'}`);
            }
            for (const number of mergeResult.merged) {
              const was = last.get(number);
              if (was && was !== 'included') {
                await notify(number, 'included', '✅ **Back in preview.** This PR is composed into preview again.');
              }
            }

      - name: Fail on migrations dropped from preview
        if: steps.dropped.outputs.found == 'true'
        env:
          FILES: ${{ steps.dropped.outputs.files }}
          LEFT: ${{ steps.dropped.outputs.left }}
        run: |
          {
            echo "## Preview's database is ahead of the new preview build"
            echo
            echo "The previous build carried these migrations and this one does not, or carries them changed:"
            echo
            echo '```'
            echo "$FILES"
            echo '```'
            echo
            echo "PRs that left the build: $LEFT"
            echo
            echo "Preview's migrate Job will refuse this image until the database is reconciled"
            echo "or the PR returns with its migrations unchanged."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error::migrations applied on preview are missing from the new build ($LEFT): $(paste -sd' ' <<<"$FILES")"
          exit 1
