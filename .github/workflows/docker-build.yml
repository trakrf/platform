name: Docker Build and Push

on:
  pull_request:
  push:
    # `preview` is the PR-stacked composition built by sync-preview.yml. It is
    # force-rewritten on every PR open/sync/close, so expect frequent builds —
    # intended. Each push publishes two tags:
    #   - `ghcr.io/trakrf/backend:sha-<short>`  — immutable, for traceability
    #   - `ghcr.io/trakrf/backend:preview`      — floating, for the GKE
    #     auto-track (TRA-483, ArgoCD Image Updater w/ digest strategy)
    # The `latest` tag stays gated on the default branch; the floating
    # `preview` tag is gated on `refs/heads/preview`. Prod uses semver tags
    # — no path for `preview` to promote into a stable ref.
    branches: [main, preview]
    # No `tags:` trigger, deliberately (TRA-1126). It existed only so a tag
    # build could re-resolve `git describe` after a merge had already baked a
    # dev-shaped version into the image. With the version declared in the commit
    # there is nothing to re-resolve, and a second build of one commit is
    # exactly the race that broke v1.4.0 (TRA-1125) — both refs wrote the shared
    # sha-<short> tag and the later one won. The release tag is now an OUTPUT of
    # the merge build; see the `release` job below.

concurrency:
  group: docker-build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  packages: write

env:
  REGISTRY_IMAGE: ghcr.io/trakrf/backend

# Multi-arch strategy (TRA-909): fork into native per-arch builds, then merge a
# manifest — NO per-arch tags. The `build` matrix builds linux/amd64 on a
# standard amd64 runner and linux/arm64 on the ARM runner in parallel, each
# pushing by digest (no tag). The `merge` job stitches the digests into one
# multi-arch tag with `docker buildx imagetools create`. Wall clock is
# ~max(amd64, arm64), not the sum, and we avoid QEMU emulation entirely (the
# ~20-min cycle-time hit that originally drove the arm64-only switch). Native
# builds also keep CGO a non-issue — though the Dockerfile already pins
# CGO_ENABLED=0, so the server binary is fully static pure-Go regardless.
#
# Downstream tags stay byte-correct for free: promote-prod.yml and
# sync-preview.yml both manipulate the manifest (imagetools create / branch
# composition), never rebuild, so the multi-arch index propagates to :prod and
# :preview without changes.

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
            arch: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        # No fetch-depth: 0. It existed only so `git describe` could resolve the
        # platform version (TRA-485); the version is now read from the committed
        # VERSION file (TRA-1126), which a shallow clone has.

      - name: Compute platform version
        id: version
        run: |
          set -euo pipefail
          # On preview-branch builds, append the list of PR numbers currently
          # merged into preview, sourced from the .preview-manifest file written
          # by sync-preview.yml. Result: `v1.5.0-dev-preview+419+420`, so a
          # quick refresh of the preview env tells you which PRs are in it
          # (TRA-851) AND a non-technical viewer can tell preview's release line
          # from prod's at a glance (TRA-1126).
          #
          # The suffix also keeps preview unpromotable while a release PR is
          # OPEN: the composition then contains a clean VERSION, and without the
          # suffix that preview image would carry a clean vX.Y.Z label on a
          # commit that is not, and never will be, the release commit
          # (TRA-1126 Finding 3).
          suffix=""
          if [[ "${GITHUB_REF}" == "refs/heads/preview" && -s .preview-manifest ]]; then
            prs=$(tr '\n' '+' < .preview-manifest | sed 's/+$//')
            if [[ -n "${prs}" ]]; then
              suffix="-preview+${prs}"
            fi
          fi
          version=$(./scripts/build-version.sh "${suffix}")
          {
            echo "suffix=${suffix}"
            echo "version=${version}"
          } >> "$GITHUB_OUTPUT"
          echo "Platform version: ${version}"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY_IMAGE }}
          # `preview` is given priority=50 (below `sha`'s default 100) so the
          # immutable `sha-<short>` remains the primary version output — that
          # keeps BUILD_TAG/VITE_BUILD_TAG pinned to a real commit instead of
          # the floating label, so /health and /version.json stay honest.
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=preview,enable=${{ github.ref == 'refs/heads/preview' }},priority=50
            type=sha,prefix=sha-,format=short

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: production
          platforms: ${{ matrix.platform }}
          # Push by digest only — no tag here. The merge job applies the tags
          # to the assembled manifest list. `push=false` on pull_request keeps
          # PRs build-only (validates both arches compile, nothing published).
          outputs: type=image,name=${{ env.REGISTRY_IMAGE }},push-by-digest=true,name-canonical=true,push=${{ github.event_name != 'pull_request' }}
          # Plain single-platform manifests merge cleanly. Provenance/SBOM
          # attestations would wrap each digest in an image index, which
          # imagetools create then nests — yielding bogus unknown/unknown
          # platform entries in the final tag. Disable so each digest is a
          # single OCI manifest.
          provenance: false
          labels: ${{ steps.meta.outputs.labels }}
          # Per-arch cache scopes — the two matrix legs run concurrently and
          # would clobber a shared gha cache otherwise.
          cache-from: type=gha,scope=backend-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=backend-${{ matrix.arch }}
          # Inject build metadata so /health and frontend /version.json report
          # the deployed commit. BUILD_TAG uses the primary ref tag produced
          # by metadata-action (sha-xxxx on commits, latest on default branch).
          # APP_VERSION is not a judgment made here — it is derived from the
          # committed VERSION file, and the Dockerfile COPYs the same file and
          # FAILS the build if the two disagree. It is passed only because the
          # OCI label cannot read a file (TRA-1126).
          # Dockerfile propagates these to the frontend stage as VITE_* env.
          # The environment banner is NOT baked here — it's runtime-driven from
          # the backend's ENVIRONMENT_LABEL env var (TRA-853), so one image
          # serves every environment.
          build-args: |
            COMMIT_SHA=${{ github.sha }}
            BUILD_TAG=${{ steps.meta.outputs.version }}
            APP_VERSION=${{ steps.version.outputs.version }}
            VERSION_SUFFIX=${{ steps.version.outputs.suffix }}

      - name: Export digest
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          # The artifact only needs the digest in its name; the file is an
          # empty marker the merge job globs to reconstruct the @sha256 refs.
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          # Distinct per-arch names — upload-artifact@v4 names are immutable, so
          # the two legs cannot share one artifact. merge job globs `digest-*`.
          name: digest-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # Required-status-check shim. The branch ruleset requires a context named
  # exactly `build`, but the matrix above emits `build (linux/amd64, ...)` /
  # `build (linux/arm64, ...)` — the bare `build` context matches neither, so
  # without this every PR would be permanently BLOCKED. This re-exports a single
  # `build` check that's green only when every matrix leg succeeded. It's
  # independent of the matrix dimensions, so changing runner labels or arches
  # never forces a ruleset edit.
  build-complete:
    name: build
    needs: build
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify all arch builds succeeded
        run: |
          if [ "${{ needs.build.result }}" != "success" ]; then
            echo "::error::One or more arch builds did not succeed (result: ${{ needs.build.result }})"
            exit 1
          fi

  merge:
    # No manifest to merge on PRs — the build job already validated both arches.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY_IMAGE }}
          # Same tag rules as the build job — metadata-action derives them from
          # the github context (ref, sha), so no checkout is needed here.
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=preview,enable=${{ github.ref == 'refs/heads/preview' }},priority=50
            type=sha,prefix=sha-,format=short

      - name: Create manifest list and push
        working-directory: /tmp/digests
        env:
          DOCKER_METADATA_OUTPUT_JSON: ${{ steps.meta.outputs.json }}
        run: |
          # Stitch the per-arch digests into one multi-arch tag set. The `-t`
          # flags come from metadata-action's tag list; the trailing args are
          # the digest refs (one empty marker file per arch in this dir).
          # SC2046: the word-splitting on both $(...) is deliberate — each
          # expands to multiple separate CLI args.
          # shellcheck disable=SC2046
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.REGISTRY_IMAGE }}@sha256:%s ' *)

      - name: Inspect image
        run: |
          docker buildx imagetools inspect ${{ env.REGISTRY_IMAGE }}:${{ steps.meta.outputs.version }}

  # TRA-1126: the release tag is an OUTPUT of the merge build, not the trigger
  # for a second one. When the merged commit declares a clean VERSION, this job
  # mints the git tag vX.Y.Z at that commit and publishes
  # ghcr.io/trakrf/backend:vX.Y.Z from the manifest the merge job just pushed.
  # Both are written once, by one job — the immutability `sha-<short>` was
  # wrongly documented as having (TRA-1125).
  #
  # Merging to main still deploys nothing. promote-prod remains the separate,
  # manual, human-triggered step, and that is where the deploy gate belongs;
  # this only decides when a PROMOTABLE artifact is minted.
  #
  # The tag push uses the default GITHUB_TOKEN on purpose: pushes made with it
  # do not trigger workflows, so there is no path back into this workflow even
  # if a `tags:` trigger were ever reintroduced.
  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: merge
    permissions:
      # Scoped per-job: the workflow default is `contents: read`, and pushing
      # the tag needs write. Widening it workflow-wide would hand write access
      # to every build leg for no reason.
      contents: write
      packages: write
    outputs:
      version: ${{ steps.decide.outputs.version }}
      action: ${{ steps.decide.outputs.action }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Tags and full history: resolve-release-action.sh has to see whether
          # this version is already tagged, and at which commit.
          fetch-depth: 0

      - name: Decide what to release
        id: decide
        run: |
          set -euo pipefail
          version=$(tr -d '[:space:]' < VERSION)
          action=$(./scripts/resolve-release-action.sh "${version}" "${GITHUB_SHA}")
          {
            echo "version=${version}"
            echo "action=${action}"
          } >> "$GITHUB_OUTPUT"
          echo "VERSION=${version} -> ${action}"

      - name: Mint the release tag
        if: steps.decide.outputs.action == 'create'
        env:
          TAG: v${{ steps.decide.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${TAG}" -m "Release ${TAG}"
          git push origin "${TAG}"
          echo "Minted ${TAG} at ${GITHUB_SHA}"

      - name: Log in to GHCR
        if: contains(fromJSON('["create", "skip"]'), steps.decide.outputs.action)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish the release image tag
        # 'create' and 'skip' only — NOT 'stale'. On 'skip' the git tag already
        # names this exact commit, so republishing is a no-op that also repairs
        # a prior run which minted the tag and died before this step. On 'stale'
        # the tag names a DIFFERENT commit, and publishing here would re-point a
        # released image tag at a commit that is not the release.
        if: contains(fromJSON('["create", "skip"]'), steps.decide.outputs.action)
        env:
          TAG: v${{ steps.decide.outputs.version }}
        run: |
          set -euo pipefail
          src="${REGISTRY_IMAGE}:sha-${GITHUB_SHA:0:7}"
          docker buildx imagetools create --tag "${REGISTRY_IMAGE}:${TAG}" "${src}"
          echo "Published ${REGISTRY_IMAGE}:${TAG} from ${src}"
          docker buildx imagetools inspect "${REGISTRY_IMAGE}:${TAG}"

      - name: Summary
        if: steps.decide.outputs.action != 'none'
        env:
          TAG: v${{ steps.decide.outputs.version }}
          ACTION: ${{ steps.decide.outputs.action }}
        run: |
          set -euo pipefail
          if [ "${ACTION}" = "stale" ]; then
            {
              echo "### No release minted"
              echo
              echo "\`VERSION\` still declares **${TAG}**, which is already released at a"
              echo "different commit. Nothing was tagged and nothing was published."
              echo
              echo "This is the expected state between the release merge and the"
              echo "bump-back PR landing. If the bump-back is already merged, someone"
              echo "has edited \`VERSION\` back to a shipped number — bump it forward."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          {
            echo "### Release ${TAG}"
            echo
            echo "- git tag: \`${TAG}\` (${ACTION})"
            echo "- image: \`${REGISTRY_IMAGE}:${TAG}\`"
            echo
            echo "Promote with: \`gh workflow run promote-prod.yml -f source=${TAG}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  # Opens the follow-up PR that returns VERSION to the next -dev, so main does
  # not sit at a promotable version. Deliberately a separate job with its own
  # failure surface, because it is COSMETIC: assert-release-commit.sh binds a
  # clean version to the exact commit its tag names, so nothing depends on this
  # landing, or on when (TRA-1126 Finding 4).
  #
  # Uses the trakrf-preview-sync App token rather than GITHUB_TOKEN. PRs opened
  # with the default token do not trigger workflows, so the required checks
  # (`build`, `lint-test`, `api-spec`, `main contract-tests must be green`)
  # would never report and the PR would sit permanently BLOCKED — the same
  # anti-recursion gate sync-preview.yml documents for its push to `preview`.
  bump-back:
    if: needs.release.outputs.action == 'create'
    runs-on: ubuntu-latest
    needs: release
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Generate App token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.PREVIEW_SYNC_APP_ID }}
          private-key: ${{ secrets.PREVIEW_SYNC_APP_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Open the bump-back PR
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          RELEASED: ${{ needs.release.outputs.version }}
        run: |
          set -euo pipefail
          next=$(awk -F. '{printf "%d.%d.0-dev", $1, $2 + 1}' <<< "${RELEASED}")
          branch="chore/bump-version-to-${next}"

          if git ls-remote --exit-code --heads origin "${branch}" >/dev/null 2>&1; then
            echo "${branch} already exists — nothing to do."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "${branch}"
          printf '%s\n' "${next}" > VERSION
          git add VERSION
          git commit -m "chore: bump VERSION to ${next}

          Returns main to an in-development version after releasing v${RELEASED}.

          Refs: TRA-1126"
          git push origin "${branch}"

          gh pr create \
            --base main \
            --head "${branch}" \
            --title "chore: bump VERSION to ${next}" \
            --body "Automatic follow-up to the \`v${RELEASED}\` release (TRA-1126).

          Returns \`main\` to an in-development version so preview and ordinary
          main builds read \`v${next}\` rather than the released line.

          This is **cosmetic**. \`scripts/assert-release-commit.sh\` binds a clean
          \`vX.Y.Z\` label to the exact commit its git tag names, so an image built
          while \`VERSION\` was still clean cannot be promoted regardless of when
          this lands."
