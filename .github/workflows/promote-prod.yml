name: Promote to prod

# Moves the floating `ghcr.io/trakrf/backend:prod` tag onto an already-built,
# already-tested image (TRA-854 / TRA-375). This is a pure manifest re-tag via
# `docker buildx imagetools` — NO rebuild — so the artifact promoted to prod is
# byte-identical to the one validated on main/preview. Deliberately a manual
# dispatch (not a push trigger): promotion is an explicit, audited action, which
# is the whole point of the floating-tag deploy model.
#
# Cutover / rollback both = dispatch this with the target source tag, then flip
# (or leave) the prod imageTag = `prod` on the infra side; ArgoCD re-pulls the
# digest `:prod` now resolves to.

on:
  workflow_dispatch:
    inputs:
      source:
        description: 'Git ref to promote — a release tag (v1.3.0), a branch, or a full SHA. Leave empty for current main. An existing sha-xxxxxxx / latest image tag is also accepted.'
        required: false
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  # Never let two promotions race on the :prod tag.
  group: promote-prod
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history + tags: resolve-promote-source.sh resolves release tags
          # and ancestry-checks against origin/main. A shallow clone has neither.
          fetch-depth: 0

      - name: Resolve source image tag
        id: resolve
        env:
          SOURCE: ${{ inputs.source }}
        run: |
          set -euo pipefail
          # TRA-1085: the operator names a git ref; the script works out the
          # image tag. The old inline regex lived here and now lives in the
          # script, which is unit-tested (scripts/test-release-guards.sh) —
          # `git rev-parse --short` returns 8 characters while
          # docker/metadata-action publishes 7, and getting that wrong is what
          # failed the first v1.3.0 promotion. Ancestry against origin/main is
          # what preserves the old rule that only main-derived images promote.
          tag=$(./scripts/resolve-promote-source.sh "${SOURCE}")
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "Resolved '${SOURCE:-<empty, using main>}' -> ${tag}"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Promote source to :prod
        env:
          SOURCE: ${{ steps.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/trakrf/backend"

          # Pre-flight: fail loudly if the source doesn't exist, rather than
          # creating a :prod tag that resolves to nothing.
          echo "Resolving ${IMAGE}:${SOURCE} ..."
          docker buildx imagetools inspect "${IMAGE}:${SOURCE}"

          # TRA-1085: refuse an image built before its release tag existed.
          # APP_VERSION is `git describe` at BUILD time and nothing rebuilds on
          # promote, so merge-then-tag bakes a dev version in permanently and
          # /health would report it for the life of the release. The label is
          # stamped by the Dockerfile's production stage; metadata-action's
          # org.opencontainers.image.version holds the image TAG, not this.
          # Note `.Image` is keyed by platform on a multi-arch manifest, which
          # ours always is (TRA-909) — extract-image-version.sh handles that
          # shape and requires every arch to agree.
          echo "Reading id.trakrf.app-version from ${IMAGE}:${SOURCE} ..."
          APP_VERSION=$(docker buildx imagetools inspect "${IMAGE}:${SOURCE}" \
            --format '{{ json .Image }}' | ./scripts/extract-image-version.sh)
          echo "Image reports version: ${APP_VERSION:-<none>}"
          ./scripts/assert-release-version.sh "${APP_VERSION}"

          # Pure manifest re-tag — copies the source manifest to :prod, no rebuild.
          docker buildx imagetools create --tag "${IMAGE}:prod" "${IMAGE}:${SOURCE}"

          echo "Promoted ${IMAGE}:${SOURCE} -> ${IMAGE}:prod"
          echo "### :prod now resolves to:"
          docker buildx imagetools inspect "${IMAGE}:prod"
