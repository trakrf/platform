# Demo laptop power behaviour.
# The power key is the off switch, and it is a clean poweroff: systemd stops
# the rootless stack (Timescale included) on the way down.
# Lid closed on AC during a demo must NOT take the box down: the screen goes,
# the server and the demo LAN stay. Lid closed on battery means the kit is
# being packed, so power off cleanly rather than suspend into a bag.
[Login]
HandlePowerKey=poweroff
HandlePowerKeyLongPress=poweroff
HandleLidSwitch=poweroff
HandleLidSwitchExternalPower=ignore
HandleLidSwitchDocked=ignore
