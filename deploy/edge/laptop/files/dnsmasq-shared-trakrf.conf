# NetworkManager shared-mode dnsmasq for the demo LAN (br-demo, 192.168.8.10/24).
# Replaces the Slate's dnsmasq: the app name resolves to this box offline.
# @DEMO_HOST@ is filled in by setup-host.sh (default app.demo-1.trakrf.id; the
# EliteDesk keeps app.demo.trakrf.id, so two kits never claim one name).
address=/@DEMO_HOST@/192.168.8.10
# The DHCP pool is NOT set here: NetworkManager passes its own --dhcp-range,
# and a second one would add an overlapping pool rather than replace it. The
# pool is the br-demo profile's ipv4.shared-dhcp-range (setup-host.sh), kept
# at .100-.199 so the Slate's old reservations (.20 CS463, .21 Shelly,
# .22 GL-S10, .23 MK107) can be pinned with dhcp-host= lines in
# dhcp-hosts-trakrf.conf without colliding with a dynamic lease.
